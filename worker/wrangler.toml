name = "telltale-tier2"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Device keys, written by the AWS register Lambda: device_id -> {"pk": base64, "status": "active"|"revoked"}.
# Create with `npx wrangler kv namespace create DEVICES` and put the id here.
kv_namespaces = [{ binding = "DEVICES", id = "REPLACE_WITH_KV_NAMESPACE_ID" }]

[vars]
AWS_API_URL = "https://REPLACE_WITH_AWS_API_HOST"

# Secrets (never in this file):
#   npx wrangler secret put RESPONSE_SIGNING_SEED   # base64 32-byte Ed25519 seed (see tier2_scorer/README.md)
#   npx wrangler secret put ORIGIN_SECRET           # shared with the AWS register Lambda

# Builds the Rust scorer to WASM before every `wrangler dev` / `wrangler deploy`.
[build]
command = "cargo build --release --lib --target wasm32-unknown-unknown --manifest-path ../tier2_scorer/Cargo.toml"
