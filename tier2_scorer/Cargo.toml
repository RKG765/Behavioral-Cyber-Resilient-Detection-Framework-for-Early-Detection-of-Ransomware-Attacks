[package]
name = "tier2_scorer"
version = "0.1.0"
edition = "2021"
description = "Telltale Tier-2 behavioral scorer: one crate for the AWS Lambda (native) and Cloudflare Worker (WASM) builds"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# The Lambda binary only; the library and the WASM build stay dependency-free.
lambda = [
    "dep:lambda_http", "dep:tokio", "dep:serde", "dep:serde_json", "dep:aws-config", "dep:aws-sdk-dynamodb",
    "dep:reqwest", "dep:p256", "dep:ed25519-dalek", "dep:sha2", "dep:base64", "dep:jsonwebtoken",
    "dep:getrandom", "dep:aws-sdk-cloudwatch", "dep:aws-sdk-cloudwatchlogs",
    "dep:futures-util", "dep:aws-sdk-cognitoidentityprovider",
]

[dependencies]
lambda_http = { version = "0.13", optional = true }
tokio = { version = "1", features = ["macros"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
# default-features off: the SDK default also pulls the legacy hyper 0.14 + rustls 0.21 client (RUSTSEC-2026-0098 etc.)
aws-sdk-dynamodb = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
jsonwebtoken = { version = "9", optional = true }
getrandom = { version = "0.2", features = ["std"], optional = true }
p256 = { version = "0.14", features = ["ecdsa"], optional = true }
ed25519-dalek = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
aws-sdk-cloudwatch = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cognitoidentityprovider = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }

[[bin]]
name = "lambda"
required-features = ["lambda"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
